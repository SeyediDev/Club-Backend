  only:
    - develop

# ============================================
# DEPLOY TO STAGE
# ============================================

deploy:stage:
  stage: deploy-stage
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Publishing all services..."
    - dotnet publish src/Channel/Club.Channel.Api/Club.Channel.Api.csproj -c Release -o ./publish/channel-api
    - dotnet publish src/CustomerPortal/Club.CustomerPortal.Api/Club.CustomerPortal.Api.csproj -c Release -o ./publish/portal-api
    - dotnet publish src/EventHandler/Club.EventHandler.Api/Club.EventHandler.Api.csproj -c Release -o ./publish/eventhandler-api
    - dotnet publish src/PromotionJobWorker/Club.PromotionJobWorker.Api/Club.PromotionJobWorker.Api.csproj -c Release -o ./publish/promotionjob-api
    - dotnet publish src/AdminPanel/Club.AdminPanel.Web/Club.AdminPanel.Web.csproj -c Release -o ./publish/admin-web
    - echo "Deploying to stage..."
  environment:
    name: stage
    url: https://stage.club.stts.dev
  dependencies:
    - build
  tags:
    - docker
  only:
    - stage
  when: manual

# ============================================
# DEPLOY TO PRODUCTION
# ============================================

deploy:production:
  stage: deploy-production
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Publishing all services..."
    - dotnet publish src/Channel/Club.Channel.Api/Club.Channel.Api.csproj -c Release -o ./publish/channel-api
    - dotnet publish src/CustomerPortal/Club.CustomerPortal.Api/Club.CustomerPortal.Api.csproj -c Release -o ./publish/portal-api
    - dotnet publish src/EventHandler/Club.EventHandler.Api/Club.EventHandler.Api.csproj -c Release -o ./publish/eventhandler-api
    - dotnet publish src/PromotionJobWorker/Club.PromotionJobWorker.Api/Club.PromotionJobWorker.Api.csproj -c Release -o ./publish/promotionjob-api
    - dotnet publish src/AdminPanel/Club.AdminPanel.Web/Club.AdminPanel.Web.csproj -c Release -o ./publish/admin-web
    - echo "Deploying to production..."
  environment:
    name: production
    url: https://club.stts.dev
  dependencies:
    - build
  tags:
    - docker
  only:
    - master
  when: manual

# ============================================
# MIRROR TO GITHUB
# ============================================

mirror:github:
  stage: mirror
  image: alpine/git
  script:
    - echo "Mirroring to GitHub..."
    - git clone --mirror $CI_REPOSITORY_URL temp-repo
    - cd temp-repo
    - git push --mirror https://$GITHUB_TOKEN@github.com/SeyediDev/Club-Backend.git || true
  only:
    - master
    - develop
    - stage
  when: on_success
  allow_failure: true
  tags:
    - docker
  variables:
    GITHUB_TOKEN: $GITHUB_MIRROR_TOKEN
