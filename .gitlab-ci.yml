stages:
  - build
  - test
  - deploy-develop
  - deploy-stage
  - deploy-production
  - mirror

variables:
  DOTNET_VERSION: "8.0"

# ============================================
# BUILD ALL MICROSERVICES
# ============================================

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Restoring NuGet packages..."
    - dotnet restore Club.Backend.sln
    - echo "Building all projects..."
    - dotnet build Club.Backend.sln --configuration Release --no-restore
  artifacts:
    paths:
      - "**/bin/Release/"
    expire_in: 1 hour
  tags:
    - docker
  only:
    - develop
    - stage
    - master

# ============================================
# TEST
# ============================================

test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Running tests..."
    - dotnet test --configuration Release --no-build --logger "trx" --collect:"XPlat Code Coverage" || echo "Tests completed"
  dependencies:
    - build
  artifacts:
    when: always
    paths:
      - "**/TestResults/**/*.trx"
    reports:
      junit:
        - "**/TestResults/**/*.trx"
  tags:
    - docker
  allow_failure: true
  only:
    - develop
    - stage
    - master

# ============================================
# DEPLOY TO DEVELOP
# ============================================

deploy:channel-api:develop:
  stage: deploy-develop
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - echo "Publishing Channel API..."
    - dotnet publish src/Channel/Club.Channel.Api/Club.Channel.Api.csproj -c Release -o ./publish/channel-api
    - echo "Deploying to develop..."
    # TODO: Docker build/push or SSH deploy
  environment:
    name: develop-channel
    url: https://channel-develop.club.stts.dev
  dependencies:
    - build
  tags:
    - docker
  only:
    - develop

