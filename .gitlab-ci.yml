  script:
    - echo "Publishing EventHandler API..."
    - dotnet publish src/EventHandler/Club.EventHandler.Api/Club.EventHandler.Api.csproj -c Release -o ./publish/eventhandler-api
    - echo "Deploying to develop..."
  environment:
