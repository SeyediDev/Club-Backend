# ===============================================
# GitHub Actions Workflow for Club Backend
# ===============================================

name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/club

jobs:
  # ==========================================
  # Prepare - Clone Dependencies
  # ==========================================
  prepare:
    name: Prepare Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Club Repository
        uses: actions/checkout@v4
        with:
          path: Club

      - name: Checkout Neo Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.NEO_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: Neo

      - name: Checkout Neo.Bpms Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.NEO_BPMS_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: Neo.Bpms

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Upload workspace
        uses: actions/upload-artifact@v3
        with:
          name: workspace
          path: |
            Club
            Neo
            Neo.Bpms
          retention-days: 1

  # ==========================================
  # Build
  # ==========================================
  build:
    name: Build Solution
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v3
        with:
          name: workspace

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          cd Club/Backend
          dotnet restore Club.Backend.sln

      - name: Build
        run: |
          cd Club/Backend
          dotnet build Club.Backend.sln --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: |
            Club/Backend/**/bin/Release
          retention-days: 1

  # ==========================================
  # Test
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v3
        with:
          name: workspace

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-output
          path: Club/Backend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: |
          cd Club/Backend
          dotnet test Club.Backend.sln --configuration Release --no-build --logger trx --results-directory "TestResults"

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: Club/Backend/TestResults
          retention-days: 7

  # ==========================================
  # Docker Build and Push
  # ==========================================
  docker-build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service:
          - name: admin-panel
            dockerfile: Club/Backend/src/AdminPanel/Club.AdminPanel.Web/Dockerfile.new
          - name: channel-api
            dockerfile: Club/Backend/src/Channel/Club.Channel.Api/Dockerfile.new
          - name: customer-portal-api
            dockerfile: Club/Backend/src/CustomerPortal/Club.CustomerPortal.Api/Dockerfile.new

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v3
        with:
          name: workspace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ==========================================
  # Deploy to Staging
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.club.example.com
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Examples:
          # - kubectl set image deployment/...
          # - ssh to server and docker-compose pull && docker-compose up -d
          # - ArgoCD sync
          # - Helm upgrade

  # ==========================================
  # Deploy to Production
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://club.example.com
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here

  # ==========================================
  # Code Quality & Security
  # ==========================================
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download workspace
        uses: actions/download-artifact@v3
        with:
          name: workspace

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run code analysis
        run: |
          cd Club/Backend
          dotnet format --verify-no-changes --verbosity diagnostic || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        service: [admin-panel, channel-api, customer-portal-api]
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

